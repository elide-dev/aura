name: "Compose bazel cache config"
description: >
   Selects the CI cache backend and emits a bazelrc fragment. A shell probe
   exposes the backend through step outputs before any action condition
   uses it.

   With the BUILDBUDDY_API_KEY secret exported, linux-x64 jobs run on the
   BuildBuddy RBE executors (--config=rbe) so action results are shared
   across CI and local development; macOS jobs use the BuildBuddy remote
   cache + BES only (--config=buildbuddy — the workers are linux, and darwin
   addons need the host Xcode toolchain). Both carry the remote downloader
   for toolchain archives. The legacy in-cluster bazel-remote branch remains
   for runners that inject BAZEL_REMOTE_USER/_PASSWORD. The
   actions/cache-backed disk-cache archives this action used to restore are
   retired: the BuildBuddy cache is shared across runner images and
   branches, which is what the per-image warm archives simulated. Fork PRs
   see an empty secret and build cold — their bazel fallback path is rare
   (prebuilt addons cover PRs).

outputs:
   rc:
      description: Path to the generated bazelrc fragment
      value: ${{ steps.compose.outputs.rc }}
   remote:
      description: Whether the shell probe selected the cluster remote cache
      value: ${{ steps.backend.outputs.remote }}

runs:
   using: composite
   steps:
      - name: Detect bazel cache backend
        id: backend
        shell: bash
        run: |
           set -euo pipefail
           remote=false
           if [ -n "${BAZEL_REMOTE_USER:-}" ] || [ -n "${BAZEL_REMOTE_PASSWORD:-}" ]; then
             if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ -z "${BAZEL_REMOTE_PASSWORD:-}" ]; then
               echo "::error::BAZEL_REMOTE_USER and BAZEL_REMOTE_PASSWORD must both be set"
               exit 1
             fi
             remote=true
           fi
           echo "remote=$remote" >> "$GITHUB_OUTPUT"

      - name: Compose cache config
        id: compose
        shell: bash
        env:
           REMOTE: ${{ steps.backend.outputs.remote }}
        run: |
           set -euo pipefail

           # BuildBuddy composition (jobs opt in by exporting the
           # BUILDBUDDY_API_KEY secret into the environment; fork PRs see an
           # empty secret and skip this cleanly):
           #   kata pods    -> --config=bes only. Build results stream to the
           #                   BuildBuddy UI while the artifact cache stays on
           #                   the in-cluster bazel-remote (faster and free of
           #                   egress); a second --remote_cache would clobber it.
           #   hosted       -> --config=buildbuddy (BES + BuildBuddy remote
           #                   cache + remote downloader).
           # Mask the key BEFORE writing the rc: config=ci enables
           # --announce_rc, which prints --remote_header lines verbatim.
           buildbuddy_rc=""
           if [ -n "${BUILDBUDDY_API_KEY:-}" ]; then
             echo "::add-mask::$BUILDBUDDY_API_KEY"
             buildbuddy_rc="common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
           fi

           rc="$RUNNER_TEMP/bazel-cache.rc"
           if [ "$REMOTE" = "true" ]; then
             # Mask the derived credential BEFORE writing the rc (see above).
             raw_auth="${BAZEL_REMOTE_USER}:${BAZEL_REMOTE_PASSWORD}"
             auth="$(printf %s "$raw_auth" | base64 | tr -d '\n')"
             echo "::add-mask::$raw_auth"
             echo "::add-mask::$auth"
             {
               # The PVC mount lives outside $HOME. Pods are single-job and
               # use RUNNER_TEMP for Bazel's output root.
               echo "startup --output_user_root=$RUNNER_TEMP/bazel-root"
               echo "common --config=ci"
               echo "common --repository_cache=/opt/bazel-repo-cache"
               echo "common --repo_env=OMP_XWIN_CACHE_DIR=/opt/bazel-repo-cache/xwin"
               echo "common --config=cache-rw"
               echo "common --remote_cache=grpcs://bazel-remote.bazel-cache.svc.cluster.local:9092"
               echo "common --tls_certificate=infra/bazel-remote/ca.crt"
               echo "common --remote_header='authorization=Basic ${auth}'"
               echo "common --remote_download_toplevel"
               if [ -n "$buildbuddy_rc" ]; then
                 echo "common --config=bes"
                 echo "$buildbuddy_rc"
               fi
             } > "$rc"
           else
             # Job-local repository cache: repo rules within one job reuse
             # downloads across output bases; cross-job reuse rides the
             # BuildBuddy remote downloader in --config=buildbuddy instead of
             # the retired actions/cache archives.
             mkdir -p "$HOME/.cache/omp-bazel-repo"
             {
               echo "common --config=ci"
               echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
               if [ -n "$buildbuddy_rc" ]; then
                 # linux-x64 executes on the BuildBuddy RBE workers (rbe
                 # implies the buildbuddy cache config) so CI and local
                 # `--config=rbe` builds share one action cache. macOS stays
                 # cache-only: the workers are linux, and darwin addons need
                 # the host Xcode toolchain.
                 if [ "$(uname -s)" = "Linux" ] && [ "$(uname -m)" = "x86_64" ]; then
                   echo "common --config=rbe"
                 else
                   echo "common --config=buildbuddy"
                 fi
                 echo "$buildbuddy_rc"
               fi
             } > "$rc"
           fi

           echo "rc=$rc" >> "$GITHUB_OUTPUT"
