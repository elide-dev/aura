name: Warm hosted-runner caches

# Historically this workflow also warmed per-image bazel disk caches for the
# darwin release scopes (GitHub-hosted runners only see actions/cache entries
# created on the default branch, and bazel disk-cache archives don't transfer
# across runner images). The BuildBuddy remote cache retired that job: every
# bazel consumer — kata, hosted linux, and the darwin release legs — now
# shares content-addressed artifacts through BuildBuddy (see the bazel-cache
# action), so a release build reuses the previous release's actions with no
# same-image warm archive in between.
#
# What remains is the bun store seed:
#
#   warm_bun (ubuntu-22.04) -> the shared `bun-<os>-<lockhash>` store entry.
#                              PR jobs restore it but never save (per-PR-ref
#                              copies of the ~500 MB store once ate ~9.4 GB of
#                              the 10 GB repo cache quota and evicted every
#                              bazel archive).

on:
   push:
      branches: [main]
      paths:
         - "bun.lock"
         - ".github/**"
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: bazel-cache-warm
   cancel-in-progress: false

jobs:
   # Produces the shared bun store entry PR jobs restore. bun-install's save
   # half only runs on non-PR events, and main CI jobs run on omp-kata (PVC
   # store, no GitHub cache), so this is the sole hosted-runner producer.
   warm_bun:
      name: Seed bun store cache
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
